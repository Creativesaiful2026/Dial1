name: DialMe CI

on:
  push:
    branches: [ main, "phase-*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle and Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/gradle-9.3.1
          key: gradle-9.3.1-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-9.3.1-${{ runner.os }}-

      - name: Install Gradle 9.3.1
        run: |
          GRADLE_VERSION="9.3.1"
          GRADLE_DIR="$HOME/gradle-$GRADLE_VERSION"
          if [ ! -x "$GRADLE_DIR/bin/gradle" ]; then
            curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d "$HOME"
            rm -f /tmp/gradle.zip
          fi
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"
          "$GRADLE_DIR/bin/gradle" --version

      - name: Configure Android SDK and Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "Android SDK not found at $SDK_DIR"
            exit 1
          fi
          if [ ! -w "$SDK_DIR" ]; then
            sudo chown -R "$(whoami)" "$SDK_DIR"
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_DIR"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-36.1"

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: gradle lintDebug --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DialMe-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DialMe-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
